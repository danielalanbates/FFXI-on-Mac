# DXVK 1.10.3 settings for every world's client. The launcher copies this file to
# C:\dxvk-cache\dxvk.conf in the prefix (only when it differs) and points DXVK_CONFIG_FILE at it,
# so every world reads the same file whatever folder its client starts in.
#
# Only what is already the effective behaviour ships here. Anything that changes it -- such as
# d3d9.maxFrameLatency = 1, which the benchmark harness used -- is an in-world A/B first; see
# docs/BETA-59.md.

# Keep compiled pipelines in DXVK_STATE_CACHE_PATH (C:\dxvk-cache) between runs. DXVK's writer
# thread appends each pipeline as it is compiled, so the cache survives a crash or a kill too.
dxvk.enableStateCache = True
