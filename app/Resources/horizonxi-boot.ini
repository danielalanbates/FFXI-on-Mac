; FFXI on Mac: the HorizonXI boot profile (Ashita v4).
;
; Play copies this to config/boot/horizonxi.ini when the client has none, then writes the account
; into `command` (Credentials.apply). HorizonXI's own launcher writes that file from its settings
; each time it starts the game, and their client download ships without one, so a client this
; launcher installed has nothing else to start from. Ashita's example profiles are not it: they
; boot `pol.exe`, Ashita's DarkStar-era loader, which cannot log in to HorizonXI.
;
; Values are HorizonXI's own stock profile, with no account, no machine path and no personal
; choice. Two values differ from their stock file: 0029 (sound channels) is at its maximum, as in
; scripts/max.json, and 0042 (a Windows screenshot folder) is left to the game. Why each setting
; is kept: docs/BETA-61.md. The settings BootProfile.swift treats as required are added to an
; existing profile that lacks them; nothing a user set is ever changed.

[ashita.launcher]
autoclose = 1
name      = HorizonXI

[ashita.boot]
file       = .\\bootloader\\horizon-loader.exe
command    = --server play.horizonxi.com
gamemodule = ffximain.dll
script     = default.txt
args       =

[ashita.language]
playonline = 2
ashita     = 2

[ashita.logging]
level      = 5
crashdumps = 1

[ashita.taskpool]
threadcount = -1

[ashita.resources]
offsets.use_overrides   = 1
pointers.use_overrides  = 1
resources.use_overrides = 1

[ashita.window.startpos]
x = -1
y = -1

[ashita.input]
gamepad.allowbackground        = 0
gamepad.disableenumeration     = 0
keyboard.blockinput            = 0
keyboard.blockbindsduringinput = 1
keyboard.silentbinds           = 0
keyboard.windowskeyenabled     = 0
mouse.blockinput               = 0
mouse.unhook                   = 1

[ashita.misc]
addons.silent  = 0
aliases.silent = 0
plugins.silent = 0

[ashita.polplugins]
sandbox = 1
pivot   = 1

[ashita.polplugins.args]

[ffxi.direct3d8]
presentparams.backbufferformat                  = -1
presentparams.backbuffercount                   = -1
presentparams.multisampletype                   = -1
presentparams.swapeffect                        = -1
presentparams.enableautodepthstencil            = -1
presentparams.autodepthstencilformat            = -1
presentparams.flags                             = -1
presentparams.fullscreen_refreshrateinhz        = -1
presentparams.fullscreen_presentationinterval   = -1
behaviorflags.fpu_preserve                      = 0

